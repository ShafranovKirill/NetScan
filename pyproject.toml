[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan-desktop"
version = "0.2.0"
description = "Desktop subnet and HTTP proxy availability scanner"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<1", "keyring>=25,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
netscan = "netscan.__main__:main"

[tool.setuptools.packages.find]
include = ["netscan*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packaging/test_validate_release.py"]
